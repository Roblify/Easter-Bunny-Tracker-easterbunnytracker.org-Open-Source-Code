<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="assets/img/Bunny.png" type="image/png">
  <title>404 - Easter Bunny Tracker</title>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:        #080b14;
      --surface:   #0f1525;
      --border:    rgba(255, 255, 255, 0.08);
      --accent:    #7ecbff;
      --accent2:   #ffcf6e;
      --text:      #e8eaf2;
      --muted:     #6b7280;
      --glow:      rgba(126, 203, 255, 0.18);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
    }

    /* ── Starfield ── */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--dur, 3s) ease-in-out infinite var(--delay, 0s);
      opacity: 0;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0; }
      50%       { opacity: var(--peak, 0.7); }
    }

    /* ── Floating eggs in background ── */
    .egg-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .egg-float {
      position: absolute;
      font-size: var(--size, 1.4rem);
      opacity: 0.07;
      animation: floatUp var(--dur, 18s) linear infinite var(--delay, 0s);
    }

    @keyframes floatUp {
      0%   { transform: translateY(110vh) rotate(0deg);   opacity: 0; }
      10%  { opacity: 0.07; }
      90%  { opacity: 0.07; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    /* ── Layout ── */
    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 24px;
      gap: 0;
    }

    /* ── Bunny ── */
    .bunny-wrap {
      position: relative;
      margin-bottom: 28px;
      animation: bunnyBob 2.8s ease-in-out infinite;
    }

    @keyframes bunnyBob {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }

    .bunny-glow {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
      animation: glowPulse 2.8s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.15); }
    }

    .bunny-img {
      position: relative;
      width: 90px;
      height: 90px;
      filter: drop-shadow(0 0 18px rgba(126, 203, 255, 0.4));
    }

    /* ── 404 number ── */
    .code {
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -4px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 60%, #ff9ecd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
      animation: fadeSlideDown 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Heading ── */
    .heading {
      font-size: clamp(1.1rem, 3.5vw, 1.5rem);
      font-weight: 800;
      color: var(--text);
      margin-bottom: 10px;
      animation: fadeSlideDown 0.7s 0.1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* ── Sub text ── */
    .sub {
      font-size: clamp(0.82rem, 2.5vw, 0.97rem);
      color: var(--muted);
      max-width: 380px;
      line-height: 1.6;
      margin-bottom: 36px;
      animation: fadeSlideDown 0.7s 0.2s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* ── Home button ── */
    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 30px;
      background: linear-gradient(135deg, var(--accent) 0%, #4eb8ff 100%);
      color: #06101f;
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 0 24px rgba(126, 203, 255, 0.35), 0 4px 16px rgba(0,0,0,0.4);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      animation: fadeSlideDown 0.7s 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .home-btn:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 0 36px rgba(126, 203, 255, 0.55), 0 8px 24px rgba(0,0,0,0.45);
    }

    .home-btn:active {
      transform: translateY(0) scale(0.98);
    }

    .home-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* ── Divider ── */
    .divider {
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 32px auto 0;
      animation: fadeSlideDown 0.7s 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .brand {
      margin-top: 14px;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      animation: fadeSlideDown 0.7s 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
  </style>
</head>

<body>

  <!-- Starfield -->
  <div class="stars" id="stars"></div>

  <!-- Floating egg emojis in background -->
  <div class="egg-bg" id="eggBg"></div>

  <div class="page">

    <div class="bunny-wrap">
      <div class="bunny-glow"></div>
      <img class="bunny-img" src="assets/img/Bunny.png" alt="Easter Bunny" onerror="this.style.display='none'">
    </div>

    <div class="code">404</div>

    <div class="heading">Oops! The Bunny hopped away.</div>

    <p class="sub">
      The page you're looking for doesn't exist or may have been moved.
      The Easter Bunny couldn't find it either!
    </p>

    <a class="home-btn" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
        <polyline points="9 21 9 12 15 12 15 21"/>
      </svg>
      Back to Home
    </a>

    <div class="divider"></div>
    <div class="brand">Easter Bunny Tracker</div>

  </div>

  <script>
    // Generate starfield
    const starsEl = document.getElementById("stars");
    for (let i = 0; i < 120; i++) {
      const s = document.createElement("div");
      s.className = "star";
      const size = Math.random() * 2 + 0.5;
      s.style.cssText = `
        left: ${Math.random() * 100}%;
        top:  ${Math.random() * 100}%;
        width:  ${size}px;
        height: ${size}px;
        --dur:   ${2 + Math.random() * 4}s;
        --delay: ${Math.random() * 5}s;
        --peak:  ${0.3 + Math.random() * 0.7};
      `;
      starsEl.appendChild(s);
    }

    // Generate floating eggs
    const eggs = ["🥚", "🐣", "🐰", "🌸", "🌷"];
    const eggBg = document.getElementById("eggBg");
    for (let i = 0; i < 18; i++) {
      const e = document.createElement("div");
      e.className = "egg-float";
      e.textContent = eggs[Math.floor(Math.random() * eggs.length)];
      e.style.cssText = `
        left:    ${Math.random() * 100}%;
        --size:  ${0.9 + Math.random() * 1.4}rem;
        --dur:   ${14 + Math.random() * 14}s;
        --delay: ${Math.random() * -20}s;
      `;
      eggBg.appendChild(e);
    }
  </script>

</body>
</html>
